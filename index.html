<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDOL SIM · 爱豆模拟器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314151C'/%3E%3Cpath d='M11 8h10v14a5 5 0 0 1-10 0z' fill='%23FF3D77'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F4F2EC;
  --ink:#14151C;
  --ink2:#4A4C58;
  --mute:#8B8A86;
  --line:#DCD8CC;
  --pink:#FF3D77;
  --pink-deep:#D42256;
  --card:#FFFDF7;
  --gold:#B98A2E;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100svh;line-height:1.6}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}

.wrap{max-width:760px;margin:0 auto;padding:0 18px 70px}
.view{display:none}
.view.active{display:block}

/* ---------- 通用 ---------- */
.eyebrow{font-size:10.5px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hr{height:1px;background:var(--line);margin:22px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:50px;padding:0 22px;background:var(--ink);color:var(--paper);
  font-size:14px;font-weight:600;letter-spacing:.04em;border-radius:2px;
  transition:transform .12s ease,background .18s ease;
}
.btn:hover{background:#000}
.btn:active{transform:scale(.98)}
.btn.pink{background:var(--pink);color:#fff}
.btn.pink:hover{background:var(--pink-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{background:rgba(20,21,28,.05)}
.btn:disabled{background:#E5E2D8;color:#A5A29A;cursor:not-allowed;transform:none}
.btn.sm{height:38px;padding:0 14px;font-size:12.5px}

/* ---------- 开屏：K-POP 舞台 ---------- */
body.dark{background:#07070A}
#v-start{margin:0 -18px;padding:0 18px;background:#07070A}
.kp{
  position:relative;min-height:100svh;display:flex;flex-direction:column;
  padding:24px 0 34px;overflow:hidden;color:#F4F2EE
}
.kp::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(58% 38% at 82% 4%,rgba(255,45,135,.55),rgba(255,45,135,0) 70%),
    radial-gradient(52% 42% at 4% 26%,rgba(104,74,255,.5),rgba(104,74,255,0) 72%),
    radial-gradient(70% 45% at 50% 104%,rgba(0,196,255,.2),rgba(0,196,255,0) 70%);
}
.kp::after{
  content:"";position:absolute;left:-20%;right:-20%;top:-26%;height:78%;pointer-events:none;
  background:conic-gradient(from 196deg at 50% 0%,transparent 0deg,rgba(255,255,255,.08) 7deg,transparent 15deg,transparent 178deg,rgba(255,255,255,.06) 186deg,transparent 196deg);
  filter:blur(1.5px)
}
.kp-grain{
  position:absolute;inset:0;pointer-events:none;opacity:.28;
  background-image:radial-gradient(rgba(255,255,255,.35) .5px,transparent .5px);
  background-size:3px 3px;
}
.kp-top{position:relative;z-index:2;display:flex;justify-content:space-between;gap:10px;
  font-size:9px;letter-spacing:.26em;color:rgba(244,242,238,.5);text-transform:uppercase}
.kp-title{position:relative;z-index:2;margin-top:34px}
.kp-title .big{
  font-size:clamp(78px,26vw,158px);line-height:.79;font-weight:900;letter-spacing:-.075em;
  background:linear-gradient(178deg,#FFFFFF 0%,#E8EAF2 32%,#8E93A6 52%,#FFFFFF 68%,#B9BFD0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 26px rgba(255,45,135,.35));
}
.kp-title .kr{margin-top:16px;font-size:11px;letter-spacing:.32em;color:rgba(244,242,238,.6)}
.kp-sub{position:relative;z-index:2;margin-top:24px;max-width:20em;
  font-size:13.5px;line-height:1.95;color:rgba(244,242,238,.72)}

.kp-cards{position:relative;z-index:2;margin-top:32px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{
  position:relative;text-align:left;padding:0;overflow:hidden;border-radius:6px;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.pcard:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.45);box-shadow:0 22px 46px -28px rgba(255,45,135,.9)}
.pcard .art{position:relative;height:118px;display:grid;place-items:center;overflow:hidden}
.pcard.a .art{background:radial-gradient(130% 110% at 18% -10%,#FF2D87 0%,#8A2BE2 52%,#1B0A2B 100%)}
.pcard.b .art{background:radial-gradient(130% 110% at 82% -10%,#00D4FF 0%,#2A4BFF 52%,#070F26 100%)}
.pcard .art::after{
  content:"";position:absolute;inset:0;mix-blend-mode:overlay;opacity:.4;
  background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1px);background-size:6px 6px
}
.pcard .no{position:relative;z-index:2;font-size:50px;font-weight:900;letter-spacing:-.07em;color:#fff;
  text-shadow:0 6px 28px rgba(0,0,0,.5)}
.pcard .tt{position:absolute;left:10px;bottom:8px;z-index:2;font-size:8.5px;letter-spacing:.22em;color:rgba(255,255,255,.82)}
.pcard .tx{padding:11px 12px 13px}
.pcard .tx b{display:block;font-size:14.5px;font-weight:700;color:#fff;letter-spacing:-.01em}
.pcard .tx small{display:block;margin-top:5px;font-size:10.5px;line-height:1.65;color:rgba(244,242,238,.55)}
.pcard .go{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:9.5px;letter-spacing:.16em;color:#FF6EA8}
.pcard.b .go{color:#5FE3FF}
.kp-meta{position:relative;z-index:2;margin-top:24px;display:flex;gap:16px;flex-wrap:wrap;
  font-size:9.5px;letter-spacing:.14em;color:rgba(244,242,238,.42)}
.kp-meta b{display:block;margin-top:4px;font-size:16px;font-weight:700;letter-spacing:-.01em;color:#F4F2EE}
.kp-foot{position:relative;z-index:2;margin-top:auto;padding-top:26px;display:flex;gap:8px;flex-wrap:wrap}
.btn.dk{background:transparent;border:1px solid rgba(255,255,255,.26);color:#F4F2EE}
.btn.dk:hover{background:rgba(255,255,255,.1)}

/* ---------- 选角 ---------- */
.setup-head{padding:44px 0 0}
.setup-head h2{font-size:clamp(30px,8vw,44px);line-height:1.08;font-weight:800;letter-spacing:-.035em}
.setup-head p{margin-top:12px;color:var(--ink2);font-size:13.5px;max-width:26em;line-height:1.85}
.block{margin-top:34px}
.block-label{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;color:var(--mute);margin-bottom:12px}
.block-label i{flex:1;height:1px;background:var(--line);display:block}
.opt-list{display:grid;gap:8px}
.opt{
  text-align:left;padding:15px 16px;background:var(--card);border:1px solid var(--line);border-radius:2px;
  display:flex;align-items:center;gap:14px;transition:all .16s ease
}
.opt:hover{border-color:#B9B4A6}
.opt.on{border-color:var(--ink);background:#FFF;box-shadow:inset 3px 0 0 var(--pink)}
.opt .k{font-size:13.5px;font-weight:600}
.opt .d{font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.6}
.opt .mk{width:16px;height:16px;border:1px solid #C6C2B5;border-radius:50%;flex:0 0 auto}
.opt.on .mk{border-color:var(--pink);background:var(--pink);box-shadow:inset 0 0 0 3px var(--card)}
.name-input{
  width:100%;height:52px;padding:0 15px;background:var(--card);border:1px solid var(--line);
  font-size:16px;letter-spacing:.02em;border-radius:2px
}
.name-input:focus{outline:none;border-color:var(--ink)}
.setup-cta{margin-top:38px}
.hint{font-size:11.5px;color:var(--mute);margin-top:10px}

/* ---------- 游戏主界面 ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,242,236,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:52px;gap:12px}
.tb-left{display:flex;align-items:baseline;gap:9px;min-width:0}
.tb-left b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.tb-left span{font-size:10.5px;letter-spacing:.14em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ap{display:flex;gap:4px;align-items:center}
.ap i{width:9px;height:9px;border-radius:50%;background:var(--pink);display:block}
.ap i.off{background:#D8D4C8}

.panel{padding-top:22px}
.weekrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.weekrow .w{font-size:11px;letter-spacing:.18em;color:var(--mute)}
.weekrow .big{font-size:44px;font-weight:800;line-height:.9;letter-spacing:-.04em}
.weekrow .big small{font-size:13px;font-weight:600;letter-spacing:0;color:var(--mute);margin-left:4px}
.weekrow .money{text-align:right}
.weekrow .money b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.weekrow .money span{font-size:10.5px;letter-spacing:.12em;color:var(--mute)}

.stats{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.stat{min-width:0}
.stat .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.stat .n{font-size:11px;letter-spacing:.12em;color:var(--ink2)}
.stat .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .bar{height:5px;margin-top:6px;background:#E4DFD3;overflow:hidden;border-radius:1px}
.stat .bar i{display:block;height:100%;background:var(--ink);transition:width .35s cubic-bezier(.2,.8,.3,1)}
.stat .bar i.pink{background:var(--pink)}
.stat .bar i.gold{background:var(--gold)}
.stat .bar i.blue{background:#4B57A8}

.lover-strip{margin-top:16px;padding:13px 15px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;gap:12px;border-radius:2px}
.lover-strip .h{width:26px;height:26px;flex:0 0 auto}
.lover-strip .tx{min-width:0;flex:1}
.lover-strip b{font-size:13px}
.lover-strip small{display:block;font-size:11px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lover-strip .risk{font-size:10.5px;letter-spacing:.1em;color:var(--pink-deep);flex:0 0 auto}

.sect{margin-top:28px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sect-h h4{font-size:12px;letter-spacing:.16em;color:var(--mute);font-weight:600}
.sect-h em{font-style:normal;font-size:11px;color:var(--mute)}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{
  position:relative;text-align:left;padding:13px 13px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:2px;transition:all .16s ease;min-height:86px;
  display:flex;flex-direction:column;justify-content:space-between
}
.act:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.act:disabled{opacity:.42;cursor:not-allowed}
.act .an{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.act .ad{font-size:11px;color:var(--mute);line-height:1.55;margin-top:4px}
.act .ac{position:absolute;right:10px;top:11px;font-size:9.5px;letter-spacing:.08em;color:#A9A69C}
.act .ac.hot{color:var(--pink-deep)}
.act .chev{font-size:15px;color:#C9C4B6;line-height:1}

.members{display:grid;gap:8px}
.mem{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:2px}
.mem .av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;letter-spacing:-.02em}
.mem .mi{min-width:0;flex:1}
.mem .mt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mem .mt b{font-size:13px}
.mem .mt small{font-size:10px;color:var(--mute);letter-spacing:.08em}
.mem .bar{height:4px;margin-top:6px;background:#E7E2D6;border-radius:1px;overflow:hidden}
.mem .bar i{display:block;height:100%;background:#4B57A8;transition:width .3s ease}
.mem .mood{margin-top:5px;font-size:10.5px;color:var(--mute)}

.log{margin-top:12px;border-top:1px solid var(--line)}
.logi{padding:11px 0;border-bottom:1px solid #E7E3D7;display:flex;gap:10px;font-size:12.5px;line-height:1.7;
  animation:fin .35s ease both}
.logi .t{flex:0 0 44px;font-size:10px;letter-spacing:.08em;color:var(--mute);padding-top:3px}
.logi .m{flex:1;color:var(--ink2)}
.logi .m b{color:var(--ink)}
.logi.hot .m b{color:var(--pink-deep)}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.bottom-bar{margin-top:30px;display:flex;gap:10px}
.bottom-bar .btn{flex:1}

/* ---------- 弹窗 ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,16,22,.55);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;padding:0}
.scrim.on{display:flex}
.sheet{
  width:100%;max-width:560px;background:var(--paper);border-radius:8px 8px 0 0;
  padding:26px 20px calc(24px + env(safe-area-inset-bottom));max-height:88svh;overflow:auto;
  animation:up .32s cubic-bezier(.2,.9,.3,1)
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .st{font-size:10.5px;letter-spacing:.2em;color:var(--pink-deep)}
.sheet h3{margin-top:10px;font-size:23px;line-height:1.3;font-weight:800;letter-spacing:-.03em}
.sheet .body{margin-top:14px;font-size:13.5px;line-height:1.9;color:var(--ink2)}
.sheet .opt-list{margin-top:22px}
.sheet .close{margin-top:10px;font-size:12px;color:var(--mute);text-align:center;width:100%;padding:12px}
.result-line{margin-top:16px;padding:12px 14px;border-left:2px solid var(--pink);background:rgba(255,61,119,.06);
  font-size:12.5px;line-height:1.8;display:none}
.result-line.on{display:block}

/* ---------- 结局 ---------- */
.end{padding:60px 0 30px}
.end-k{font-size:11px;letter-spacing:.2em;color:var(--mute)}
.end h1{margin-top:14px;font-size:clamp(38px,11vw,64px);line-height:.98;font-weight:800;letter-spacing:-.045em}
.end h1 em{font-style:normal;color:var(--pink)}
.end .rank{margin-top:26px;display:flex;align-items:baseline;gap:10px}
.end .rank b{font-size:78px;line-height:1;font-weight:800;letter-spacing:-.06em}
.end .rank span{font-size:12px;color:var(--mute);letter-spacing:.1em}
.end p.txt{margin-top:18px;font-size:14px;line-height:2;color:var(--ink2);max-width:30em}
.end-stats{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.end-stats div{background:var(--card);padding:13px 14px}
.end-stats span{font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.end-stats b{display:block;font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.end-cta{margin-top:32px;display:grid;gap:10px}

.gallery{margin-top:26px}
.g-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}
.g-item .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);flex:0 0 auto}
.g-item.locked{color:#B7B4AA}
.g-item.locked .dot{background:#D8D4C8}
.g-item small{margin-left:auto;font-size:10.5px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:80;background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:2px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .25s ease;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:640px){
  .acts{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body class="dark">

<div class="wrap">
  <!-- ========== 开屏 ========== -->
  <section class="view active" id="v-start">
    <div class="kp">
      <div class="kp-grain" aria-hidden="true"></div>
      <div class="kp-top">
        <span>IDOL SIM</span><span>VOL.01</span><span>36 WEEKS</span>
      </div>

      <div class="kp-title">
        <div class="big">IDOL<br>SIM</div>
        <div class="kr">아이돌 시뮬레이터 · 爱豆模拟器</div>
      </div>

      <p class="kp-sub">从练习室的镜子前，到打歌舞台的灯牌海。<br>你要成为被爱的那一个，还是决定谁值得被爱？</p>

      <div class="kp-cards">
        <button class="pcard a" onclick="goSetup('idol')">
          <div class="art"><span class="no">01</span><span class="tt">DEBUT / IDOL</span></div>
          <div class="tx"><b>成为爱豆</b><small>练习生或直接出道<br>打歌 · 签售 · 巡演 · 私生</small><span class="go">选择路线 →</span></div>
        </button>
        <button class="pcard b" onclick="goSetup('manager')">
          <div class="art"><span class="no">02</span><span class="tt">MANAGER / TEAM</span></div>
          <div class="tx"><b>成为经纪人</b><small>带一支四人新团<br>排期 · 公关 · 拆散恋爱</small><span class="go">选择路线 →</span></div>
        </button>
      </div>

      <div class="kp-meta">
        <div>结局<b>16 种</b></div>
        <div>行动点<b>2–3 / 周</b></div>
        <div>存档<b>自动</b></div>
      </div>

      <div class="kp-foot">
        <button class="btn dk sm" onclick="openGallery()">结局图鉴</button>
        <button class="btn dk sm" onclick="loadSave()">继续上一局</button>
      </div>
    </div>
  </section>

  <!-- ========== 选角 ========== -->
  <section class="view" id="v-setup">
    <div class="setup-head">
      <div class="serial" id="setup-kicker">ROUTE A</div>
      <h2 id="setup-title">你要怎么出道</h2>
      <p id="setup-desc">练习生的路慢但底子扎实；直接出道起点高，代价是根基浅。</p>
    </div>
    <div id="setup-body"></div>
    <div class="setup-cta">
      <button class="btn pink" id="setup-start" onclick="startGame()" style="width:100%">开始第 1 周</button>
      <div class="hint" id="setup-hint"></div>
    </div>
  </section>

  <!-- ========== 游戏 ========== -->
  <section class="view" id="v-game">
    <div class="topbar">
      <div class="topbar-in">
        <div class="tb-left">
          <b id="gb-name">—</b>
          <span id="gb-sub">—</span>
        </div>
        <div class="tb-right">
          <div class="ap" id="gb-ap"></div>
        <button class="btn ghost sm" onclick="quitToStart()" style="height:32px;padding:0 10px">结束</button>
        </div>
      </div>
    </div>
    <div id="game-body"></div>
  </section>

  <!-- ========== 结局 ========== -->
  <section class="view" id="v-end">
    <div class="end" id="end-body"></div>
    <div class="gallery" id="end-gallery"></div>
  </section>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 基础 ================= */
var MAXW = 36;
var $ = function(id){ return document.getElementById(id); };
var S = null;
var curEv = null;

function clamp(v, a, b){ a = (a===undefined?0:a); b = (b===undefined?100:b); return Math.max(a, Math.min(b, v)); }
function rnd(a, b){ return Math.round(a + Math.random() * (b - a)); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function toast(msg){
  var t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('on'); }, 2100);
}

function pushLog(text, hot){
  if(!S) return;

  if(S.log.length > 40) S.log.pop();

/* ================= 通用：数值变化 ================= */
function bump(key, delta, cap){
  if(!S) return;
  S[key] = clamp(S[key] + delta, key==='money'||key==='budget'||key==='subs'||key==='risk'||key==='heart' ? 0 : 0, cap===undefined?100:cap);
  if(key==='money'||key==='budget') S[key] = Math.max(0, S[key]);
}

function apMax(){ return S.route==='idol' ? (S.trainee?3:2) : 2; }

function avgPop(){ var t=0; S.members.forEach(function(m){t+=m.pop;}); return Math.round(t/S.members.length); }
function avgMood(){ var t=0; S.members.forEach(function(m){t+=m.mood;}); return Math.round(t/S.members.length); }

  $('gb-name').textContent = S.name;
  $('gb-sub').textContent = S.route==='idol'
    ? (S.group + ' · ' + S.pos + ' · 第 ' + S.week + ' 周')
    : (S.group + ' 经纪人 · ' + S.styleName + ' · 第 ' + S.week + ' 周');
  var a = '';
  for(var i=0;i<apMax();i++) a += '<i class="'+(i<S.ap?'':'off')+'"></i>';

/* ================= 偶像行动 ================= */
function act(kind){
  if(!S || S.ap<=0) return;
  var def = ACTS_IDOL.filter(function(a){return a.id===kind;})[0];
  if(!def) return;
  if(S.sta < def.cost){ toast('体力不够了，先休息一周'); return; }

  S.ap--; S.sta = Math.max(0, S.sta - def.cost);
  var msg = '';

  if(kind==='practice'){
    var g = (S.position==='主唱'?2:(S.position==='主舞'?1:0));
    S.tal = clamp(S.tal + rnd(5,7) + g);
    msg = '练到凌晨，' + (S.trainee?'月末评价的老师多看了你两眼。':'镜子里的动作终于不再迟疑。');
    if(S.tal>85) msg += '有人说你现在的现场已经能救场了。';
  }
  if(kind==='variety'){
    S.pop = clamp(S.pop + rnd(5,7));
    S.rep = clamp(S.rep + (S.position==='综艺担当'?4:2));
    msg = '录制现场你接住了那个梗。剪辑出来之后，弹幕在刷你的名字。';
  }
  if(kind==='bbl'){
    S.subs = Math.max(0, S.subs + rnd(14,20));
    S.pop = clamp(S.pop + 2);
    msg = '泡泡上发了一条「今天有点想你们」。订阅数往上跳了一截。';
  }
  if(kind==='fansign'){
    S.money += 25; S.rep = clamp(S.rep + 3); S.pop = clamp(S.pop + 1);
    msg = '签售会排到 800 号。有人握着你的手说「我等了你三年」，你差点没忍住。';
  }
  if(kind==='concert'){
    S.money += 120; S.pop = clamp(S.pop + 5); S.rep = clamp(S.rep + 4);
    msg = '灯牌亮起来的那一秒，全场喊你的名字。你在返场时哭了，被拍到了。';
  }
  if(kind==='sponsor'){
    S.money += 40; S.pop = clamp(S.pop + 2); S.rep = clamp(S.rep - 5);
    msg = '又接了一个代言。评论区说你现在像广告牌，什么都卖。';
  }
  if(kind==='manage'){
    S.trust = clamp(S.trust + 7);
    msg = '陪室长喝了两杯，他说「你是这批里最省心的」。';
  }
  if(kind==='social'){ openSocialSheet(); return; }
  if(kind==='date'){ doDate(); return; }
  if(kind==='rest'){
    S.sta = clamp(S.sta + 28);
    msg = '睡了十一个小时。醒来的时候，手机上有 300 条未读。';
  }

  pushLog(msg, kind==='concert');
  saveGame();
  if(!maybeScene(kind)) render();
}

  }
  if(kind==='tour'){
    S.budget += 70;
    S.members.forEach(function(m){ m.pop = clamp(m.pop + 3); m.mood = clamp(m.mood - 16 + styleMod); });
    S.grep = clamp(S.grep - 3);

  }

/* ================= 周推进 ================= */
function nextWeek(){
  if(!S || S.ended) return;
  if(S.ap > 0 && !confirm('还有 ' + S.ap + ' 点行动没用掉，确定结束本周？')) return;
  S.week++;
  S.ap = apMax();

  if(S.route==='idol'){
    S.sta = clamp(S.sta + 6);
    S.money += Math.round(S.subs / 20 * (1 + S.tal / 200));
    if(S.rep < 30) S.pop = clamp(S.pop - 2);
    if(S.week % 4 === 0) comeback();
  }else{
    S.budget = Math.max(0, S.budget - 8);
    S.members.forEach(function(m){
      m.mood = clamp(m.mood - 3);
      if(m.mood < 35) m.pop = clamp(m.pop - 3);
      if(m.mood > 80) m.pop = clamp(m.pop + 1);
    });
    var gp = avgPop();
    S.boss = clamp(S.boss + (gp>=70 ? 2 : -3));
    S.grep = clamp(S.grep + (avgMood()>=60 ? 2 : -2));
    if(S.risk >= 100) S.affairExposed = true;
  }

  saveGame();
  if(checkEnding()) return;

  if(processPending()) return;
  if(checkArcStart()) return;
  if(Math.random() < 0.35){ triggerEvent(); return; }
  render();
  if(S.ap===0) toast('这周结束了，可以继续下一周');
}

function comeback(){
  var score = S.tal*0.45 + S.pop*0.4 + S.rep*0.15 + rnd(-8,8);
  var line;
  if(score >= 82){
    S.pop = clamp(S.pop + 9); S.rep = clamp(S.rep + 6); S.money += 60; S.trust = clamp(S.trust + 6);
    S.subs += 40;
    line = '回归一位。安可舞台上你把奖杯举起来的时候，手在抖。';
  }else if(score >= 68){
    S.pop = clamp(S.pop + 5); S.rep = clamp(S.rep + 2); S.money += 30; S.subs += 20;
    line = '音源候补。差一点，但公司说这次方向对了。';
  }else if(score >= 52){
    S.pop = clamp(S.pop + 2); S.rep = clamp(S.rep + 1); S.money += 15; S.subs += 8;
    line = '成绩平稳。没有惊喜，也没有人挨骂。';
  }else{
    S.pop = clamp(S.pop - 6); S.rep = clamp(S.rep - 4); S.trust = clamp(S.trust - 3);
    line = '这次回归滑了。评论区第一条是「他们是不是不行了」。';
  }
  pushLog('【第 ' + S.week + ' 周回归】' + line, score>=82);
}

/* ================= 弹窗系统 ================= */
function openSheet(o){
  curEv = o;
  var opts = o.opts.map(function(op, i){
    return '<button class="opt" onclick="runOpt('+i+')"><span class="mk"></span>' +
      '<span><span class="k">'+op.l+'</span></span></button>';
  }).join('');
  $('sheet').innerHTML =
    '<div class="st">'+o.k+'</div><h3>'+o.t+'</h3><div class="body">'+o.b+'</div>' +
    '<div class="opt-list" id="sheet-opts">'+opts+'</div>' +
    (o.closable === false ? '' : '<button class="close" onclick="closeSheet()">先不做</button>');
  $('scrim').classList.add('on');
}

function runOpt(i){
  var msg = curEv.opts[i].fn() || '事情就这么过去了。';
  pushLog(msg, false);
  $('sheet-opts').innerHTML =
    '<div class="result-line on">'+msg+'</div>' +
    '<button class="btn pink" style="width:100%;margin-top:18px" onclick="closeSheet()">继续</button>';
  saveGame();
}

function closeSheet(){
  $('scrim').classList.remove('on');
  if(S && !S.ended){
    if(checkEnding()) return;
    render();
  }
}

var usedEv = [];

function triggerEvent(){
  var pool = (S.route==='idol' ? EV_IDOL : EV_MGR).filter(function(e){
    if(usedEv.indexOf(e.id) >= 0) return false;
    try{ return !e.cond || e.cond(); }catch(err){ return false; }
  });
  if(!pool.length){ render(); return; }
  var ev = pick(pool);
  usedEv.push(ev.id);
  openSheet({ k:'EVENT / W' + S.week, t: ev.t, b: ev.b, opts: ev.opts, closable:false });
}

/* ================= 结局 ================= */
function checkEnding(){
  if(!S || S.ended) return false;
  if(S.route==='idol'){
    if(S.pop>=92 && S.rep>=55) return endGame('i-super');
    if(S.rep<=12) return endGame('i-fall');
    if(S.trust<=8) return endGame('i-freeze');
    if(S.risk>=100 && S.lover) return endGame('i-love');
    if(S.week>=24 && (S.team||50)>=88 && S.pop>=76) return endGame('i-ace');
    if(S.week>=24 && S.lover && S.heart>=88 && S.pop>=72) return endGame('i-duo');
    if(S.week>MAXW){
      if(S.pop>=80) return endGame('i-solo');
      return endGame('i-steady');
    }
  }else{
    if(S.affairExposed) return endGame('m-scandal');
    if(S.boss<=10) return endGame('m-fire');
    if(avgMood()<=18) return endGame('m-collapse');
    if(avgPop()>=90 && S.grep>=70 && S.boss>=55) return endGame('m-legend');
    if(S.week>=24 && avgMood()>=78 && S.boss>=50) return endGame('m-family');
    if(S.week>=24 && S.lover && !S.affairExposed && S.risk<80) return endGame('m-partner');
    if(S.week>MAXW){
      if(S.budget>=400) return endGame('m-profit');
      return endGame('m-normal');
    }
  }
  return false;
}

function endGame(id){
  S.ended = true; S.endingId = id;
  try{
    var g = JSON.parse(localStorage.getItem(GALLERY_KEY) || '[]');
    if(g.indexOf(id) < 0){ g.push(id); localStorage.setItem(GALLERY_KEY, JSON.stringify(g)); }
  }catch(e){}
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  renderEnd();
  show('v-end');
  return true;
}

function renderEnd(){
  var e = ENDINGS[S.endingId] || ENDINGS['i-steady'];
  var idol = S.route === 'idol';
  var stats = idol
    ? [['人气', Math.round(S.pop)], ['实力', Math.round(S.tal)], ['口碑', Math.round(S.rep)], ['公司信任', Math.round(S.trust)]]
    : [['团体人气', avgPop()], ['口碑', Math.round(S.grep)], ['公司信任', Math.round(S.boss)], ['结余预算', Math.round(S.budget) + ' 万']];

  var html = '<div class="end-k">' + (idol ? 'ROUTE A · IDOL' : 'ROUTE B · MANAGER') + ' / W' + S.week + '</div>' +
    '<h1>你的结局<br>是<em>' + e.name + '</em></h1>' +
    '<div class="rank"><b>' + e.rank + '</b><span>FINAL RANK</span></div>' +
    '<p class="txt">' + e.txt + '</p>' +
    '<div class="end-stats">' + stats.map(function(s){
      return '<div><span>' + s[0] + '</span><b>' + s[1] + '</b></div>';
    }).join('') + '</div>' +
    '<div class="end-cta">' +
      '<button class="btn pink" onclick="restart()">再来一局</button>' +
      '<button class="btn ghost" onclick="backHome()">回到首页</button>' +
    '</div>';

  $('end-body').innerHTML = html;
  $('end-gallery').innerHTML = galleryHtml();
}

function galleryHtml(){
  var got = [];
  try{ got = JSON.parse(localStorage.getItem(GALLERY_KEY) || '[]'); }catch(e){}
  var keys = Object.keys(ENDINGS);
  var html = '<div class="sect-h"><h4>结局图鉴</h4><em>' + got.length + ' / ' + keys.length + '</em></div>';
  keys.forEach(function(k){
    var e = ENDINGS[k];
    var on = got.indexOf(k) >= 0;
    html += '<div class="g-item' + (on ? '' : ' locked') + '"><span class="dot"></span>' +
      (on ? e.name : '？？？') + '<small>' + (on ? e.rank : (e.route === 'idol' ? '爱豆线' : '经纪人线')) + '</small></div>';
  });
  return html;
}

function openGallery(){
  var got = [];
  try{ got = JSON.parse(localStorage.getItem(GALLERY_KEY) || '[]'); }catch(e){}
  $('end-body').innerHTML = '<div class="end-k">ARCHIVE</div>' +
    '<h1 style="font-size:clamp(34px,9vw,52px);margin-top:12px">结局<em>图鉴</em></h1>' +
    '<p class="txt">已解锁 ' + got.length + ' / ' + Object.keys(ENDINGS).length + '。换一条路线、换一种活法，结局会不一样。</p>' +
    '<div class="end-cta"><button class="btn ghost" onclick="backHome()">回到首页</button></div>';
  $('end-gallery').innerHTML = galleryHtml();
  show('v-end');

function restart(){
  var route = S ? S.route : 'idol';
  S = null; usedEv = [];
  goSetup(route);
}

function backHome(){
  S = null; usedEv = [];
  show('v-start');
}

function quitToStart(){
  if(!S) { show('v-start'); return; }
  if(confirm('这一局会自动存档，随时可以回来。现在回首页？')){
    saveGame();
    show('v-start');
  }
}

/* ================= 存档 ================= */
function saveGame(){
  if(!S) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ s:S, used:usedEv })); }catch(e){}
}

function loadSave(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ toast('还没有存档，先开一局吧'); return; }
    var d = JSON.parse(raw);
    S = d.s; usedEv = d.used || [];
    if(S.ended){ renderEnd(); show('v-end'); }
    else render();
  }catch(e){ toast('存档读取失败'); }
}

/* ================= 剧情系统 ================= */
/* 伏笔：某些选择会在几周后才回来找你 */
function scheduleAfter(id, delay){
  if(!S) return;
  S.pending = S.pending || [];
  S.pending.push({ w: S.week + delay, id: id });
}

function processPending(){
  if(!S || !S.pending || !S.pending.length) return false;
  var due = S.pending.filter(function(p){ return p.w <= S.week; });
  if(!due.length) return false;
  var p = due[0];
  S.pending = S.pending.filter(function(x){ return x !== p; });
  var fn = PEND_EV[p.id];
  if(!fn){ return false; }
  fn();
  return true;
}

function maybeScene(kind){
  if(!S || S.ended) return false;
  if(Math.random() > 0.3) return false;
  var list = SCENES[kind];
  if(!list || !list.length) return false;
  S.sceneUsed = S.sceneUsed || [];
  var idx = -1;
  for(var i=0;i<list.length;i++){
    if(S.sceneUsed.indexOf(kind+i) < 0){ idx = i; break; }
  }
  if(idx < 0) return false;
  S.sceneUsed.push(kind + idx);
  var sc = list[idx];
  openSheet({ k:'现场 · ' + (S.week+'周'), t: sc.t, b: sc.b, opts: sc.opts });
  return true;
}

/* ---------- 剧情启动检查 ---------- */
function checkArcStart(){
  if(!S || S.ended) return false;
  S.arc = S.arc || {};
  if(S.route === 'idol'){
    if(!S.arc.sasaeng && S.week >= 4 && Math.random() < 0.55){ ARC_SASAENG(); return true; }
    if(!S.arc.company && (S.trust < 48 || S.week >= 12) && Math.random() < 0.5){ ARC_COMPANY(); return true; }
    if(!S.arc.team && S.week >= 5 && Math.random() < 0.45){ ARC_TEAM(); return true; }
    if(!S.arc.love && S.lover && Math.random() < 0.5){ ARC_LOVE(); return true; }
  }else{
    if(!S.arc.affair && avgMood() < 60 && S.week >= 5 && Math.random() < 0.45){ ARC_M_AFFAIR(); return true; }
    if(!S.arc.exit && avgMood() <= 48 && S.week >= 6 && Math.random() < 0.45){ ARC_M_EXIT(); return true; }
    if(!S.arc.cap && S.week >= 8 && Math.random() < 0.4){ ARC_M_CAP(); return true; }
  }
  return false;
}





</script>
